<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>5x5.gg</title>
  <style>
    :root{--bg:#090b10;--panel:#12151c;--line:#272c38;--text:#f5f6f8;--muted:#8d96a6;--orange:#ff571f;--blue:#347caf;--blue2:#68b4ed}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.header{position:sticky;top:0;z-index:5;background:#0d1016ee;border-bottom:1px solid var(--line)}.header-inner{max-width:1250px;margin:auto;height:66px;padding:0 22px;display:flex;align-items:center;gap:28px}.brand{font-size:20px;font-weight:900}.mark{display:inline-block;background:var(--orange);color:#090b10;padding:7px 9px;margin-right:8px;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%)}.nav{color:var(--muted);font-weight:800}.nav:hover,.nav.active{color:#fff}.admin{margin-left:auto;background:var(--orange);color:#080a0e;padding:9px 13px;border-radius:8px;font-weight:900}.container{max-width:1250px;margin:auto;padding:34px 22px}.hero{padding:52px 0 35px}.eyebrow{color:var(--orange);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.hero h1,.heading h1{margin:7px 0;font-size:clamp(30px,5vw,54px)}.heading h1{font-size:32px}.sub{color:var(--muted);line-height:1.6}.stats,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid{grid-template-columns:repeat(3,1fr);margin-top:20px}.stat,.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.stat b{display:block;font-size:29px;color:var(--orange)}.card{cursor:pointer}.card:hover{border-color:#4b5363;transform:translateY(-2px)}.card-title{font-size:18px;font-weight:900}.meta{color:var(--muted);font-size:12px;margin-top:5px}.badge{display:inline-flex;padding:4px 7px;border-radius:5px;background:#347caf25;color:var(--blue2);font-size:10px;font-weight:900;margin:8px 5px 0 0}.overall{font-size:25px;color:var(--blue2);font-weight:900;float:right}.bar{height:5px;background:#2a2f39;margin-top:8px}.bar span{display:block;height:100%;background:var(--blue2)}.toolbar{margin:20px 0}.toolbar input{width:min(360px,100%);padding:11px 13px;background:#0d1016;color:#fff;border:1px solid var(--line);border-radius:8px}.back{display:inline-block;border:1px solid var(--line);padding:8px 12px;border-radius:8px;margin-bottom:18px}.profile{display:flex;align-items:center;gap:18px}.avatar{width:76px;height:76px;border-radius:14px;background:#1b202a;display:grid;place-items:center;color:var(--orange);font-size:22px;font-weight:900}.section{margin-top:18px}.section h2{margin:0 0 16px}.skills{max-width:520px}.skill{margin:12px 0}.skill-head{display:flex;justify-content:space-between;font-weight:800}.lineup{padding:14px 0;border-bottom:1px solid var(--line)}.lineup:last-child{border:0}.lineup-players{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pill{background:#0c0f14;border:1px solid var(--line);border-radius:8px;padding:9px 11px}.pill b{color:var(--blue2)}.empty{color:#6f7887;padding:28px;text-align:center}.error{border:1px solid #ef646155;color:#ff9d99;padding:16px;border-radius:10px}.loading{padding:70px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.header-inner{gap:13px}.brand{font-size:0}.brand .mark{font-size:16px}.grid,.stats{grid-template-columns:1fr}.container{padding:25px 16px}}
  </style>
</head>
<body>
<header class="header"><div class="header-inner"><a class="brand" href="#/"><span class="mark">5x5</span>5x5.gg</a><a class="nav" href="#/times">Times</a><a class="nav" href="#/jogadores">Jogadores</a><a class="admin" href="/admin.html">Admin</a></div></header>
<main id="app"><div class="loading">Carregando…</div></main>
<script>
const API='/api/catalog', app=document.querySelector('#app');
const skills=[['firepower','Firepower'],['entrying','Entrying'],['trading','Trading'],['opening','Opening'],['clutching','Clutching'],['sniping','Sniping'],['utility','Utility']];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function get(path){const r=await fetch(API+path);let body;try{body=await r.json()}catch{body={}}if(!r.ok)throw new Error(body.message||`Erro ${r.status}`);return body}
const avatar=text=>`<div class="avatar">${esc(String(text||'?').slice(0,3).toUpperCase())}</div>`;
const heading=(title,sub)=>`<div class="heading"><h1>${title}</h1><div class="sub">${sub}</div></div>`;
const back=href=>`<a class="back" href="${href}">← Voltar</a>`;
function playerCard(p){return `<article class="card" data-href="#/jogadores/${encodeURIComponent(p.slug)}"><span class="overall">${p.overall}</span><div class="card-title">${esc(p.nickname)}</div><div class="meta">${esc(p.displayName)} · ${esc(p.countryCode||'Sem país')}</div><div class="bar"><span style="width:${p.overall}%"></span></div></article>`}
function teamCard(t){return `<article class="card" data-href="#/times/${encodeURIComponent(t.slug)}"><div class="card-title">${esc(t.name)}</div><div class="meta">${esc(t.countryName||'Sem país')} · ${esc(t.regionName||'Sem região')}</div><span class="badge">${t.playerCount} jogadores</span><span class="badge">${t.yearCount} anos</span></article>`}
function bind(){document.querySelectorAll('[data-href]').forEach(x=>x.onclick=()=>location.hash=x.dataset.href);document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.hash===`#/${(location.hash.slice(2).split('/')[0]||'')}`))}
async function home(){const [s,players,teams]=await Promise.all([get('/summary'),get('/players?page=1&pageSize=6'),get('/teams?page=1&pageSize=6')]);app.innerHTML=`<div class="container"><section class="hero"><div class="eyebrow">Counter-Strike database</div><h1>Lineups por time e ano.</h1><p class="sub">Jogadores avaliados por skills e vinculados às suas equipes entre 2017 e 2026.</p></section><div class="stats"><div class="stat"><b>${s.regions}</b><span>regiões</span></div><div class="stat"><b>${s.countries}</b><span>países</span></div><div class="stat"><b>${s.teams}</b><span>times</span></div><div class="stat"><b>${s.players}</b><span>jogadores</span></div></div><section class="section"><h2>Jogadores</h2><div class="grid">${players.data.map(playerCard).join('')||'<div class="empty">Nenhum jogador cadastrado.</div>'}</div></section><section class="section"><h2>Times</h2><div class="grid">${teams.data.map(teamCard).join('')||'<div class="empty">Nenhum time cadastrado.</div>'}</div></section></div>`;bind()}
async function playersPage(){const rows=await get('/players?page=1&pageSize=100');app.innerHTML=`<div class="container">${heading('Jogadores','Overall calculado pela média das sete skills.')}<div class="toolbar"><input id="search" placeholder="Buscar jogador…"></div><div class="grid" id="rows">${rows.data.map(playerCard).join('')||'<div class="empty">Nenhum jogador.</div>'}</div></div>`;document.querySelector('#search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelector('#rows').innerHTML=rows.data.filter(p=>`${p.nickname} ${p.displayName}`.toLowerCase().includes(q)).map(playerCard).join('')||'<div class="empty">Nenhum resultado.</div>';bind()};bind()}
async function playerPage(slug){const p=await get('/players/'+encodeURIComponent(slug));app.innerHTML=`<div class="container">${back('#/jogadores')}<div class="profile">${avatar(p.nickname)}<div><div class="eyebrow">Overall ${p.overall}</div><h1>${esc(p.nickname)}</h1><div class="sub">${esc(p.displayName)} · ${esc(p.countryName||'Sem país')} · ${esc(p.regionName||'Sem região')}</div></div></div><section class="section skills"><h2>Estatísticas</h2>${skills.map(([key,label])=>`<div class="skill"><div class="skill-head"><span>${label}</span><span>${p[key]}/100</span></div><div class="bar"><span style="width:${p[key]}%"></span></div></div>`).join('')}</section><section class="section"><h2>Times por ano</h2>${p.teams.length?p.teams.map(x=>`<div class="lineup"><span class="badge">${x.year}</span> <a href="#/times/${encodeURIComponent(x.teamSlug)}"><b>${esc(x.teamName)}</b></a></div>`).join(''):'<div class="empty">Nenhum vínculo cadastrado.</div>'}</section></div>`;bind()}
async function teamsPage(){const rows=await get('/teams?page=1&pageSize=100');app.innerHTML=`<div class="container">${heading('Times','Abra um time para visualizar suas lineups anuais.')}<div class="toolbar"><input id="search" placeholder="Buscar time…"></div><div class="grid" id="rows">${rows.data.map(teamCard).join('')||'<div class="empty">Nenhum time.</div>'}</div></div>`;document.querySelector('#search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelector('#rows').innerHTML=rows.data.filter(t=>`${t.name} ${t.shortName||''}`.toLowerCase().includes(q)).map(teamCard).join('')||'<div class="empty">Nenhum resultado.</div>';bind()};bind()}
async function teamPage(slug){const t=await get('/teams/'+encodeURIComponent(slug));app.innerHTML=`<div class="container">${back('#/times')}<div class="profile">${avatar(t.shortName||t.name)}<div><h1>${esc(t.name)}</h1><div class="sub">${esc(t.countryName||'Sem país')} · ${esc(t.regionName||'Sem região')}</div></div></div><section class="section"><h2>Lineups por ano</h2>${t.lineups.length?t.lineups.map(l=>`<div class="lineup"><span class="badge">${l.year}</span><div class="lineup-players">${l.players.map(p=>`<a class="pill" href="#/jogadores/${encodeURIComponent(p.slug)}">${esc(p.nickname)} <b>${p.overall}</b></a>`).join('')}</div></div>`).join(''):'<div class="empty">Nenhum jogador vinculado.</div>'}</section></div>`;bind()}
async function route(){app.innerHTML='<div class="loading">Carregando…</div>';const parts=location.hash.slice(2).split('/').filter(Boolean).map(decodeURIComponent);try{if(!parts.length)return home();if(parts[0]==='jogadores'&&parts[1])return playerPage(parts[1]);if(parts[0]==='jogadores')return playersPage();if(parts[0]==='times'&&parts[1])return teamPage(parts[1]);if(parts[0]==='times')return teamsPage();location.hash='#/'}catch(e){app.innerHTML=`<div class="container"><div class="error">${esc(e.message)}</div></div>`}}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
