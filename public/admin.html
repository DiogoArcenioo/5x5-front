<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin • 5x5.gg</title>
  <style>
    :root{--bg:#090b10;--panel:#12151c;--panel2:#181c25;--line:#272c38;--text:#f5f6f8;--muted:#8d96a6;--orange:#ff571f;--blue:#3379ad;--blue2:#62a7df;--green:#38c77e;--red:#ef6461}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#ff571f1e,transparent 35%)}.login-card,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px}.login-card{width:min(420px,100%);padding:28px}.brand{font-weight:900;font-size:20px;margin-bottom:22px}.mark{display:inline-block;background:var(--orange);color:#090b10;padding:7px 9px;margin-right:8px;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%)}
    .shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{background:#0e1117;border-right:1px solid var(--line);padding:20px 13px}.side .brand{padding:0 8px}.nav{display:block;width:100%;border:0;background:none;color:#9da6b5;text-align:left;padding:11px 13px;border-radius:8px;font-weight:750;margin:3px 0}.nav:hover,.nav.active{color:#fff;background:#1a1e27}.nav.active{box-shadow:inset 3px 0 var(--orange)}.module-toggle{display:flex;align-items:center;justify-content:space-between;margin-top:17px;color:#f2b53d;background:#f2b53d0a;border:1px solid #f2b53d1f}.module-toggle:hover{color:#f8d976;background:#f2b53d12}.module-toggle .module-name{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.module-toggle .module-name:before{content:"";width:6px;height:6px;border-radius:50%;background:#f2b53d;box-shadow:0 0 10px #f2b53d66}.module-chevron{font-size:11px;transition:transform .18s ease}.module-toggle[aria-expanded=true] .module-chevron{transform:rotate(180deg)}.module-menu{margin:5px 0 0 9px;padding:2px 0 2px 10px;border-left:1px solid #343126}.module-menu.hidden{display:none}.module-menu .nav{font-size:12.5px;padding:9px 11px;color:#9da6b5}.module-menu .nav:hover{color:#fff}.module-menu .nav.active{color:#fff;box-shadow:inset 3px 0 #f2b53d;background:#1d1b17}.back{margin-top:25px;text-decoration:none}
    .content{min-width:0}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}.main{max-width:1450px;margin:auto;padding:27px}.heading{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.heading h1{font-size:28px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:minmax(330px,470px) 1fr;gap:18px}.card{padding:18px}.card h2{font-size:17px;margin:0 0 16px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:27px;color:var(--orange)}.stat span{color:var(--muted);font-size:12px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#aeb5c0;font-weight:800;text-transform:uppercase;letter-spacing:.06em}input,select,textarea{width:100%;background:#0b0e13;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 11px;outline:none}textarea{resize:vertical;min-height:120px;font:inherit;line-height:1.5}input:focus,select:focus,textarea:focus{border-color:var(--blue2)}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:#1a1e27;color:#e7e9ed;font-weight:800;font-size:12px}.btn.primary{background:var(--orange);border-color:var(--orange);color:#090b0e}.btn.danger{color:#ff9895}.btn.small{padding:6px 8px;font-size:11px}.error{color:#ff9c99;margin-top:12px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:11px;border-bottom:1px solid #20242e;text-align:left;white-space:nowrap}th{background:#0d1016;color:#7f8999;text-transform:uppercase;font-size:10px;letter-spacing:.05em}tr:last-child td{border-bottom:0}.empty{text-align:center;color:#697281;padding:30px}.badge{display:inline-flex;background:#3479ad22;color:#69b3ec;border-radius:5px;padding:3px 7px;font-weight:800;font-size:10px}.toolbar{margin-bottom:11px}.toolbar input{max-width:300px}
    .skills{margin-top:17px;padding:14px;background:#0d1016;border:1px solid var(--line);border-radius:10px}.overall{display:flex;justify-content:space-between;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:10px}.overall strong{font-size:28px;color:var(--blue2)}.skill{margin:10px 0}.skill-head{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.skill-head output{font-variant-numeric:tabular-nums}.skill input[type=range]{appearance:none;height:5px;padding:0;border:0;border-radius:0;background:linear-gradient(90deg,var(--blue) var(--value),#2b303a var(--value));margin-top:6px}.skill input[type=range]::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:var(--blue2)}
    .player-summary{min-width:180px}.mini-bar{height:4px;background:#2a2f39;margin-top:5px}.mini-bar span{display:block;height:100%;background:var(--blue2)}.lineup{margin-bottom:14px}.lineup-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}.lineup-players{display:flex;flex-wrap:wrap;gap:7px}.player-pill{border:1px solid var(--line);background:#0d1016;border-radius:8px;padding:8px 10px}.player-pill b{color:var(--blue2)}.module-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 90% 10%,#f2b53d17,transparent 34%),linear-gradient(135deg,#17191f,#111318);border:1px solid #3b372a;border-radius:14px;padding:26px}.module-kicker{font-size:9px;font-weight:900;letter-spacing:.11em;color:#f2b53d;margin-bottom:9px}.module-hero h2{font-size:23px;margin:0 0 8px}.module-hero p{max-width:720px;color:var(--muted);line-height:1.65;margin:0}.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.module-card{background:#101319;border:1px solid var(--line);border-radius:11px;padding:17px}.module-card b{display:block;margin-bottom:6px}.module-card p{font-size:12px;color:var(--muted);line-height:1.55;margin:0}.module-status{display:inline-flex;margin-top:13px;border-radius:5px;padding:4px 7px;font-size:9px;font-weight:900;color:var(--green);background:#38c77e12}.module-status.planned{color:#8d96a6;background:#8d96a611}.toast{position:fixed;right:18px;bottom:18px;background:#171b23;border:1px solid var(--line);border-left:4px solid var(--green);padding:12px 15px;border-radius:8px;z-index:20}.toast.bad{border-left-color:var(--red)}
    @media(max-width:900px){.shell{display:block}.side{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:5px;padding:9px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.side .brand{flex:0 0 auto;margin:0;padding:0 8px 0 0;white-space:nowrap}.side .nav{flex:0 0 auto;width:auto;margin:0;padding:9px 11px;white-space:nowrap}.side .module-toggle{margin:0}.side .module-menu{display:flex;align-items:center;gap:5px;margin:0;padding:0;border:0}.side .module-menu.hidden{display:none}.side .module-menu .nav{font-size:12px;padding:9px 10px}.side .back{margin:0}.content{display:block}.top{height:54px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:1fr}}@media(max-width:540px){.side .brand{font-size:0}.side .brand .mark{margin:0;font-size:14px}.fields,.stats{grid-template-columns:1fr}.field.full{grid-column:auto}.main{padding:18px}.top{padding:0 16px}}
  </style>
</head>
<body>
<section class="login" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="mark">5x5</span>5x5.gg Admin</div>
    <div class="field"><label>Usuário</label><input name="username" required autofocus></div>
    <div class="field" style="margin-top:12px"><label>Senha</label><input name="password" type="password" required></div>
    <button class="btn primary" style="width:100%;margin-top:17px">Entrar</button>
    <div class="error hidden" id="loginError"></div>
  </form>
</section>
<section class="shell hidden" id="adminShell">
  <aside class="side">
    <div class="brand"><span class="mark">5x5</span>5x5.gg</div>
    <button class="nav active" data-page="dashboard">Visão geral</button>
    <button class="nav module-toggle" id="draftModuleToggle" type="button" aria-expanded="true"><span class="module-name">Draft Module</span><span class="module-chevron">▼</span></button>
    <div class="module-menu" id="draftModuleMenu">
      <button class="nav" data-page="draft-module">Simulador</button>
      <button class="nav" data-page="base">Regiões e países</button>
      <button class="nav" data-page="teams">Times</button>
      <button class="nav" data-page="players">Jogadores e skills</button>
      <button class="nav" data-page="links">Vínculos e lineups</button>
    </div>
    <div style="font-size:9px;font-weight:900;letter-spacing:.1em;color:#657083;padding:20px 13px 5px">SISTEMA</div>
    <button class="nav" data-page="users">Usuários</button>
    <button class="nav" data-page="ranking">Ranking</button>
    <button class="nav" data-page="notifications">Notificações</button>
    <a class="nav back" href="/inicio">← Voltar ao jogo</a>
  </aside>
  <div class="content">
    <header class="top"><span id="status">API conectada</span><div><span id="user"></span> <button class="btn small" id="logout">Sair</button></div></header>
    <main class="main" id="app"></main>
  </div>
</section>
<div class="toast hidden" id="toast"></div>
<script>
const API='/api';
const skills=[['firepower','Firepower'],['entrying','Entrying'],['trading','Trading'],['opening','Opening'],['clutching','Clutching'],['sniping','Sniping'],['utility','Utility']];
const years=Array.from({length:10},(_,i)=>2017+i);
const AUTH_TOKEN_KEY='5x5.auth.token';
const auth={token:localStorage.getItem(AUTH_TOKEN_KEY),user:null};
const state={page:'dashboard',draftMenuOpen:true,regions:[],countries:[],teams:[],players:[],links:[],users:[],rankingUsers:[],notifications:[],editingTeam:null,editingPlayer:null,editingUser:null,editingNotification:null};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function notify(message,bad=false){const el=$('#toast');el.textContent=message;el.className='toast'+(bad?' bad':'');clearTimeout(notify.t);notify.t=setTimeout(()=>el.classList.add('hidden'),3500)}
async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(auth.token)headers.Authorization=`Bearer ${auth.token}`;const response=await fetch(API+path,{...options,headers});let body;try{body=await response.json()}catch{body={}}if(!response.ok){if(response.status===401){localStorage.removeItem(AUTH_TOKEN_KEY);showLogin()}const message=body.message?.message||body.message||`Erro HTTP ${response.status}`;throw new Error(Array.isArray(message)?message.join(' · '):String(message))}return body}
async function list(resource){return (await api(`/admin/data/${resource}?page=1&pageSize=100`)).data}
async function listAll(path){const first=await api(`${path}${path.includes('?')?'&':'?'}page=1&pageSize=100`);const pages=[];for(let page=2;page<=(first.meta?.totalPages||1);page++)pages.push(api(`${path}${path.includes('?')?'&':'?'}page=${page}&pageSize=100`));const rest=await Promise.all(pages);return [...(first.data||[]),...rest.flatMap(x=>x.data||[])]}
async function load(){const [regions,countries,teams,players,links,users,rankingUsers,notifications]=await Promise.all([list('regions'),list('countries'),list('teams'),listAll('/admin/players'),listAll('/admin/data/player-team-years'),listAll('/admin/users'),listAll('/admin/ranking/users'),listAll('/admin/notifications')]);Object.assign(state,{regions,countries,teams,players,links,users,rankingUsers,notifications})}
function showLogin(message=''){$('#adminShell').classList.add('hidden');$('#loginScreen').classList.remove('hidden');$('#loginError').textContent=message;$('#loginError').classList.toggle('hidden',!message)}
function showAdmin(){$('#loginScreen').classList.add('hidden');$('#adminShell').classList.remove('hidden');$('#user').textContent=auth.user.username}
const heading=(title,sub)=>`<div class="heading"><div><h1>${title}</h1><div class="sub">${sub}</div></div></div>`;
const options=(items,value,label,selected)=>items.map(x=>`<option value="${x[value]}" ${String(x[value])===String(selected)?'selected':''}>${esc(x[label])}</option>`).join('');
const countrySelect=(selected='')=>`<select name="countryId"><option value="">Sem país</option>${options(state.countries,'id','name',selected)}</select>`;
function syncDraftMenu(){const toggle=$('#draftModuleToggle'),menu=$('#draftModuleMenu');toggle.setAttribute('aria-expanded',String(state.draftMenuOpen));menu.classList.toggle('hidden',!state.draftMenuOpen)}
function render(){const views={dashboard,base,teams:teamsPage,players:playersPage,links:linksPage,users:usersPage,ranking:rankingPage,notifications:notificationsPage,'draft-module':draftModule};$('#app').innerHTML=views[state.page]();$$('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));syncDraftMenu();bind()}
function dashboard(){return heading('Visão geral','Base simplificada para montar lineups anuais.')+`<div class="stats"><div class="stat"><b>${state.regions.length}</b><span>regiões</span></div><div class="stat"><b>${state.countries.length}</b><span>países</span></div><div class="stat"><b>${state.teams.length}</b><span>times</span></div><div class="stat"><b>${state.players.length}</b><span>jogadores</span></div><div class="stat"><b>${state.links.length}</b><span>vínculos anuais</span></div></div><div class="card" style="margin-top:18px"><h2>Como a lineup funciona</h2><p class="sub">Cadastre a identidade do jogador e, no vínculo com time e ano, informe as skills daquela temporada. A lineup usa sempre os atributos do ano selecionado.</p></div>`}
function draftModule(){return heading('Draft Module','Ferramentas administrativas do jogo de simulação de draft.')+`<section class="module-hero"><div class="module-kicker">MÓDULO DO SIMULADOR</div><h2>Controle do fluxo de draft e campanha</h2><p>Esta área concentra as ferramentas que alteram o funcionamento do sorteio, da montagem da lineup e da simulação do Major. A estrutura do módulo está pronta; novos controles serão adicionados aqui somente quando estiverem conectados a configurações persistidas pelo backend.</p><div class="module-grid"><div class="module-card"><b>Sorteio e pool de jogadores</b><p>O fluxo ativo sorteia ano e time para definir os candidatos disponíveis em cada escolha.</p><span class="module-status">ATIVO NO JOGO</span></div><div class="module-card"><b>Campanha do Major</b><p>Fase suíça, classificação e playoffs fazem parte do simulador atual.</p><span class="module-status">ATIVO NO JOGO</span></div><div class="module-card"><b>Balanceamento administrativo</b><p>Parâmetros editáveis de pesos, chances e regras ainda não possuem persistência no backend.</p><span class="module-status planned">SEM CONTROLES AINDA</span></div></div><div style="margin-top:18px"><a class="btn" href="/jogar/monte-seu-time">Testar fluxo do draft →</a></div></section>`}
function base(){return heading('Regiões e países','Estrutura geográfica usada por times e jogadores.')+`<div class="grid"><div><form class="card" id="regionForm"><h2>Nova região</h2><div class="fields"><div class="field"><label>Código</label><input name="code" required maxlength="20"></div><div class="field"><label>Nome</label><input name="name" required maxlength="80"></div></div><button class="btn primary" style="margin-top:14px">Cadastrar</button></form><form class="card" id="countryForm" style="margin-top:16px"><h2>Novo país</h2><div class="fields"><div class="field"><label>Código</label><input name="code" required minlength="2" maxlength="2"></div><div class="field"><label>Nome</label><input name="name" required></div><div class="field full"><label>Região</label><select name="regionId" required><option value="">Selecione</option>${options(state.regions,'id','name')}</select></div></div><button class="btn primary" style="margin-top:14px">Cadastrar</button></form></div><div class="card"><h2>Países cadastrados</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>País</th><th>Região</th></tr></thead><tbody>${state.countries.map(c=>`<tr><td>${c.id}</td><td><b>${esc(c.code)}</b> · ${esc(c.name)}</td><td>${esc(state.regions.find(r=>r.id===c.regionId)?.name||'—')}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function teamsPage(){const t=state.editingTeam||{};return heading('Times','Organizações disponíveis para os vínculos anuais.')+`<div class="grid"><form class="card" id="teamForm"><h2>${t.id?'Editar time':'Novo time'}</h2><div class="fields"><div class="field full"><label>Nome</label><input name="name" required value="${esc(t.name)}"></div><div class="field"><label>Sigla</label><input name="shortName" value="${esc(t.shortName)}"></div><div class="field"><label>Slug</label><input name="slug" required pattern="[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*" value="${esc(t.slug)}"></div><div class="field full"><label>País</label>${countrySelect(t.countryId)}</div></div><div class="actions"><button class="btn primary">${t.id?'Salvar':'Cadastrar'}</button>${t.id?'<button type="button" class="btn" id="cancelTeam">Cancelar</button>':''}</div></form><div class="card"><h2>Times cadastrados</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Time</th><th>País</th><th>Ações</th></tr></thead><tbody>${state.teams.length?state.teams.map(t=>`<tr><td>${t.id}</td><td><b>${esc(t.name)}</b><br><span class="sub">${esc(t.shortName||t.slug)}</span></td><td>${esc(state.countries.find(c=>c.id===t.countryId)?.name||'—')}</td><td><button class="btn small" data-edit-team="${t.id}">Editar</button> <button class="btn small danger" data-delete-team="${t.id}">Excluir</button></td></tr>`).join(''):`<tr><td colspan="4" class="empty">Nenhum time.</td></tr>`}</tbody></table></div></div></div>`}
function skillEditor(player={}){const initial=skills.map(([key])=>Number(player[key]??50));const overall=Math.round(initial.reduce((a,b)=>a+b,0)/initial.length);return `<div class="skills"><div class="overall"><div><b>Overall</b><div class="sub">Média automática das skills</div></div><strong id="overallValue">${overall}</strong></div>${skills.map(([key,label],i)=>`<div class="skill"><div class="skill-head"><label for="${key}">${label}</label><output data-output="${key}">${initial[i]}/100</output></div><input type="range" id="${key}" name="${key}" min="0" max="100" value="${initial[i]}" style="--value:${initial[i]}%"></div>`).join('')}</div>`}
function playersPage(){const p=state.editingPlayer||{};return heading('Jogadores','Cadastre aqui somente a identidade e a situação de carreira do jogador.')+`<div class="grid"><form class="card" id="playerForm"><h2>${p.id?'Editar jogador':'Novo jogador'}</h2><div class="fields"><div class="field"><label>Nickname</label><input name="nickname" required value="${esc(p.nickname)}"></div><div class="field"><label>Nome</label><input name="displayName" required value="${esc(p.displayName)}"></div><div class="field"><label>Slug</label><input name="slug" required pattern="[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*" value="${esc(p.slug)}"></div><div class="field"><label>País</label>${countrySelect(p.countryId)}</div><div class="field"><label>Nascimento</label><input type="date" name="birthDate" value="${p.birthDate?String(p.birthDate).slice(0,10):''}"></div><div class="field"><label>Status</label><select name="careerStatus"><option value="active" ${p.careerStatus==='active'?'selected':''}>Ativo</option><option value="inactive" ${p.careerStatus==='inactive'?'selected':''}>Inativo</option><option value="retired" ${p.careerStatus==='retired'?'selected':''}>Aposentado</option></select></div></div><div class="actions"><button class="btn primary">${p.id?'Salvar jogador':'Cadastrar jogador'}</button>${p.id?'<button type="button" class="btn" id="cancelPlayer">Cancelar</button>':''}</div></form><div class="card"><h2>Jogadores cadastrados</h2><div class="table-wrap"><table><thead><tr><th>Jogador</th><th>Última temporada</th><th>País</th><th>Ações</th></tr></thead><tbody>${state.players.length?state.players.map(p=>`<tr><td><b>${esc(p.nickname)}</b><br><span class="sub">${esc(p.displayName)}</span></td><td>${p.statsYear?`${p.statsYear} · OVR ${p.overall}`:'SEM VÍNCULO'}</td><td>${esc(p.countryCode||'—')}</td><td><button class="btn small" data-edit-player="${p.id}">Editar</button> <button class="btn small danger" data-delete-player="${p.id}">Excluir</button></td></tr>`).join(''):`<tr><td colspan="4" class="empty">Nenhum jogador.</td></tr>`}</tbody></table></div></div></div>`}
function linksPage(){const groups=state.teams.flatMap(team=>years.map(year=>({team,year,entries:state.links.filter(l=>l.teamId===team.id&&l.year===year).map(link=>({link,player:state.players.find(p=>p.id===link.playerId)})).filter(x=>x.player)}))).filter(x=>x.entries.length);return heading('Vínculos, lineups e skills anuais','Defina o time, o ano e os atributos do jogador naquela temporada.')+`<div class="grid"><form class="card" id="linkForm"><h2>Novo vínculo anual</h2><div class="fields"><div class="field full"><label>Jogador</label><select name="playerId" required><option value="">Selecione</option>${options(state.players,'id','nickname')}</select></div><div class="field full"><label>Time</label><select name="teamId" required><option value="">Selecione</option>${options(state.teams,'id','name')}</select></div><div class="field full"><label>Ano</label><select name="year" required>${years.map(y=>`<option>${y}</option>`).join('')}</select></div></div>${skillEditor({})}<button class="btn primary" style="margin-top:15px">Criar vínculo com stats</button></form><div class="card"><h2>Lineups geradas</h2>${groups.length?groups.map(g=>`<div class="lineup"><div class="lineup-title"><b>${esc(g.team.name)}</b><span class="badge">${g.year}</span></div><div class="lineup-players">${g.entries.map(({link,player})=>`<div class="player-pill">${esc(player.nickname)} <b>${link.overall}</b><button class="btn small danger" data-delete-link="${link.id}">×</button></div>`).join('')}</div></div>`).join(''):'<div class="empty">Nenhum vínculo cadastrado.</div>'}</div></div>`}
function usersPage(){const u=state.editingUser;const editor=u?`<div><form class="card" id="userForm"><h2>Editar usuário</h2><div class="fields"><div class="field full"><label>Login</label><input name="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.-]+" value="${esc(u.username)}"></div><div class="field full"><label>E-mail</label><input name="email" type="email" maxlength="254" value="${esc(u.email)}" placeholder="Sem e-mail"></div><div class="field"><label>Função</label><select name="role"><option value="user" ${u.role==='user'?'selected':''}>Usuário</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrador</option></select></div><div class="field"><label>Status</label><select name="status"><option value="active" ${u.status==='active'?'selected':''}>Ativo</option><option value="disabled" ${u.status==='disabled'?'selected':''}>Desativado</option></select></div></div><div class="actions"><button class="btn primary">Salvar usuário</button><button type="button" class="btn" id="cancelUser">Cancelar</button></div></form><form class="card" id="passwordForm" style="margin-top:16px"><h2>Redefinir senha</h2><p class="sub">A nova senha encerra todas as sessões abertas deste usuário.</p><div class="field"><label>Nova senha</label><input name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div><button class="btn" style="margin-top:14px">Alterar senha e sair de todos os dispositivos</button></form></div>`:`<div class="card"><h2>Gerenciar conta</h2><div class="empty">Selecione um usuário na lista para editar login, e-mail, acesso ou senha.</div></div>`;return heading('Usuários','Gerencie as contas que acessam o jogo e seus vínculos de autenticação.')+`<div class="grid">${editor}<div class="card"><h2>Contas cadastradas <span class="badge">${state.users.length}</span></h2><div class="table-wrap"><table><thead><tr><th>Usuário</th><th>Acesso</th><th>Ranking</th><th>Login</th><th>Ações</th></tr></thead><tbody>${state.users.length?state.users.map(user=>`<tr><td><b>${esc(user.username)}</b><br><span class="sub">${esc(user.email||'Sem e-mail')}</span></td><td><span class="badge">${user.role==='admin'?'ADMIN':'USUÁRIO'}</span><br><span class="sub">${user.status==='active'?'Ativo':'Desativado'}</span></td><td><b>${user.points} pts</b><br><span class="sub">${user.rankedAttempts} tentativa(s)</span></td><td>${(user.providers||[]).length?`<span class="badge">${esc(user.providers.join(' + ').toUpperCase())}</span>`:'<span class="sub">Senha local</span>'}<br><span class="sub">${user.lastLoginAt?new Date(user.lastLoginAt).toLocaleDateString('pt-BR'):'Nunca entrou'}</span></td><td><button class="btn small" data-edit-user="${user.id}">Editar</button> ${Number(user.id)===Number(auth.user?.id)?'<span class="sub">Conta atual</span>':`<button class="btn small danger" data-delete-user="${user.id}" data-user-name="${esc(user.username)}">Excluir</button>`}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">Nenhuma conta cadastrada.</td></tr>`}</tbody></table></div></div></div>`}
function rankingPage(){return heading('Ranking','Controle pontos, partidas e limites diários para testes do modo ranqueado.')+`<div class="card"><div style="background:rgba(242,181,61,.07);border:1px solid rgba(242,181,61,.22);border-radius:9px;padding:12px 14px;margin-bottom:16px;color:#cdbb83;font-size:12px;line-height:1.55"><b>Ferramentas de teste:</b> “Liberar +1 tentativa” vale somente para o dia atual. “Sem limite diário” permanece ativo até ser desmarcado. Alterações de pontos e partidas não apagam o histórico real e os próximos resultados continuam sendo acumulados.</div><div class="table-wrap"><table><thead><tr><th>Usuário</th><th>Pontos</th><th>Partidas</th><th>Hoje</th><th>Limite</th><th>Ações</th></tr></thead><tbody>${state.rankingUsers.length?state.rankingUsers.map(user=>`<tr data-ranking-user="${user.id}"><td><b>${esc(user.username)}</b><br><span class="sub">${esc(user.email||'Sem e-mail')}</span></td><td><input data-ranking-points type="number" min="0" max="10000000" value="${user.points}" style="width:105px"><br><span class="sub">Ganhos reais: ${user.earnedPoints}</span></td><td><input data-ranking-matches type="number" min="0" max="1000000" value="${user.matches}" style="width:90px"><br><span class="sub">Registros reais: ${user.actualMatches}</span></td><td><b>${user.attemptsToday}</b> tentativa(s)<br><span class="sub">${user.extraAttemptsToday} extra(s) liberada(s)</span></td><td><label style="display:flex;align-items:center;gap:8px;cursor:pointer;white-space:normal"><input data-ranking-unlimited type="checkbox" ${user.unlimited?'checked':''} style="width:auto"><span>${user.unlimited?'<b style="color:var(--green)">SEM LIMITE</b>':'Regra diária'}</span></label></td><td><div class="actions" style="margin:0"><button class="btn small primary" data-save-ranking="${user.id}">Salvar</button><button class="btn small" data-release-ranking="${user.id}">Liberar +1 tentativa</button></div></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhum usuário cadastrado.</td></tr>`}</tbody></table></div></div>`}
const notificationTypeLabel={news:'Novidade',update:'Atualização',warning:'Aviso',maintenance:'Manutenção'};
function dateTimeInput(value){if(!value)return '';const date=new Date(value);date.setMinutes(date.getMinutes()-date.getTimezoneOffset());return date.toISOString().slice(0,16)}
function notificationsPage(){const n=state.editingNotification||{};return heading('Notificações','Cadastre novidades e avisos exibidos no sino do site.')+`<div class="grid"><form class="card" id="notificationForm"><h2>${n.id?'Editar notificação':'Nova notificação'}</h2><div class="fields"><div class="field full"><label>Título</label><input name="title" required minlength="3" maxlength="120" value="${esc(n.title)}" placeholder="Ex.: Novo sistema de ranking"></div><div class="field full"><label>Mensagem</label><textarea name="message" required minlength="3" maxlength="1000" placeholder="Descreva a novidade ou o aviso para os jogadores.">${esc(n.message)}</textarea></div><div class="field"><label>Categoria</label><select name="type"><option value="news" ${n.type==='news'?'selected':''}>Novidade</option><option value="update" ${n.type==='update'?'selected':''}>Atualização</option><option value="warning" ${n.type==='warning'?'selected':''}>Aviso</option><option value="maintenance" ${n.type==='maintenance'?'selected':''}>Manutenção</option></select></div><div class="field"><label>Status</label><select name="status"><option value="draft" ${n.status!=='published'?'selected':''}>Rascunho</option><option value="published" ${n.status==='published'?'selected':''}>Publicado</option></select></div><div class="field"><label>Publicar em</label><input name="publishedAt" type="datetime-local" value="${dateTimeInput(n.publishedAt)}"><span class="sub">Vazio publica imediatamente ao salvar como publicado.</span></div><div class="field"><label>Expirar em</label><input name="expiresAt" type="datetime-local" value="${dateTimeInput(n.expiresAt)}"><span class="sub">Opcional. Sem data, o aviso permanece ativo.</span></div></div><div class="actions"><button class="btn primary">${n.id?'Salvar alterações':'Cadastrar notificação'}</button>${n.id?'<button type="button" class="btn" id="cancelNotification">Cancelar</button>':''}</div></form><div class="card"><h2>Notificações cadastradas <span class="badge">${state.notifications.length}</span></h2><div class="table-wrap"><table><thead><tr><th>Conteúdo</th><th>Categoria</th><th>Status</th><th>Período</th><th>Ações</th></tr></thead><tbody>${state.notifications.length?state.notifications.map(item=>`<tr><td style="white-space:normal;min-width:240px"><b>${esc(item.title)}</b><br><span class="sub">${esc(item.message)}</span></td><td><span class="badge">${notificationTypeLabel[item.type]||item.type}</span></td><td><b style="color:${item.status==='published'?'var(--green)':'var(--muted)'}">${item.status==='published'?'PUBLICADO':'RASCUNHO'}</b><br><span class="sub">por ${esc(item.createdBy||'admin')}</span></td><td><span class="sub">Início: ${item.publishedAt?new Date(item.publishedAt).toLocaleString('pt-BR'):'não definido'}<br>Fim: ${item.expiresAt?new Date(item.expiresAt).toLocaleString('pt-BR'):'sem expiração'}</span></td><td><button class="btn small" data-edit-notification="${item.id}">Editar</button> <button class="btn small" data-toggle-notification="${item.id}" data-notification-status="${item.status}">${item.status==='published'?'Despublicar':'Publicar'}</button> <button class="btn small danger" data-delete-notification="${item.id}" data-notification-title="${esc(item.title)}">Excluir</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">Nenhuma notificação cadastrada.</td></tr>`}</tbody></table></div></div></div>`}
function numberPayload(form){const data=Object.fromEntries(new FormData(form));for(const key of ['regionId','countryId','playerId','teamId','year',...skills.map(x=>x[0])])if(data[key]!==undefined&&data[key]!=='')data[key]=Number(data[key]);for(const key of Object.keys(data)){if(data[key]==='')delete data[key];else if(typeof data[key]==='string'&&!['careerStatus','birthDate'].includes(key))data[key]=data[key].trim().toUpperCase()}return data}
async function genericCreate(resource,data){await api(`/admin/data/${resource}`,{method:'POST',body:JSON.stringify({data})})}
async function genericUpdate(resource,id,data){await api(`/admin/data/${resource}`,{method:'PATCH',body:JSON.stringify({key:{id},data})})}
async function genericDelete(resource,id){await api(`/admin/data/${resource}`,{method:'DELETE',body:JSON.stringify({key:{id}})})}
async function refresh(message){await load();render();notify(message)}
function bind(){
  $('#draftModuleToggle').onclick=()=>{state.draftMenuOpen=!state.draftMenuOpen;syncDraftMenu()};
  $$('[data-page]').forEach(x=>x.onclick=()=>{state.page=x.dataset.page;state.editingTeam=state.editingPlayer=state.editingUser=state.editingNotification=null;render()});
  $('#regionForm')?.addEventListener('submit',async e=>{e.preventDefault();try{const d=numberPayload(e.target);d.code=d.code.toUpperCase();await genericCreate('regions',d);await refresh('Região cadastrada.')}catch(x){notify(x.message,true)}});
  $('#countryForm')?.addEventListener('submit',async e=>{e.preventDefault();try{const d=numberPayload(e.target);d.code=d.code.toUpperCase();await genericCreate('countries',d);await refresh('País cadastrado.')}catch(x){notify(x.message,true)}});
  $('#teamForm')?.addEventListener('submit',async e=>{e.preventDefault();try{const d=numberPayload(e.target);state.editingTeam?await genericUpdate('teams',state.editingTeam.id,d):await genericCreate('teams',d);state.editingTeam=null;await refresh('Time salvo.')}catch(x){notify(x.message,true)}});
  $('#playerForm')?.addEventListener('submit',async e=>{e.preventDefault();try{const d=numberPayload(e.target);const path=state.editingPlayer?`/admin/players/${state.editingPlayer.id}`:'/admin/players';await api(path,{method:state.editingPlayer?'PATCH':'POST',body:JSON.stringify(d)});state.editingPlayer=null;await refresh('Jogador salvo.')}catch(x){notify(x.message,true)}});
  $('#linkForm')?.addEventListener('submit',async e=>{e.preventDefault();try{await genericCreate('player-team-years',numberPayload(e.target));await refresh('Vínculo criado; lineup atualizada.')}catch(x){notify(x.message,true)}});
  $('#userForm')?.addEventListener('submit',async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));data.username=data.username.trim();data.email=data.email.trim()||null;const updated=await api(`/admin/users/${state.editingUser.id}`,{method:'PATCH',body:JSON.stringify(data)});if(Number(updated.id)===Number(auth.user.id)){auth.user={...auth.user,...updated};$('#user').textContent=auth.user.username}state.editingUser=null;await refresh('Usuário atualizado.')}catch(x){notify(x.message,true)}});
  $('#passwordForm')?.addEventListener('submit',async e=>{e.preventDefault();if(!confirm('Alterar a senha e encerrar todas as sessões deste usuário?'))return;try{const data=Object.fromEntries(new FormData(e.target));await api(`/admin/users/${state.editingUser.id}/password`,{method:'POST',body:JSON.stringify(data)});state.editingUser=null;await refresh('Senha alterada e sessões encerradas.')}catch(x){notify(x.message,true)}});
  $('#notificationForm')?.addEventListener('submit',async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));data.title=data.title.trim();data.message=data.message.trim();data.publishedAt=data.publishedAt?new Date(data.publishedAt).toISOString():null;data.expiresAt=data.expiresAt?new Date(data.expiresAt).toISOString():null;const path=state.editingNotification?`/admin/notifications/${state.editingNotification.id}`:'/admin/notifications';await api(path,{method:state.editingNotification?'PATCH':'POST',body:JSON.stringify(data)});state.editingNotification=null;await refresh('Notificação salva.')}catch(x){notify(x.message,true)}});
  $$('input[type=range]').forEach(input=>input.oninput=()=>{input.style.setProperty('--value',input.value+'%');$(`[data-output="${input.name}"]`).textContent=input.value+'/100';const vals=skills.map(([k])=>Number($(`[name="${k}"]`).value));$('#overallValue').textContent=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)});
  $$('[data-edit-team]').forEach(x=>x.onclick=()=>{state.editingTeam=state.teams.find(t=>t.id===Number(x.dataset.editTeam));render()});
  $$('[data-edit-player]').forEach(x=>x.onclick=()=>{state.editingPlayer=state.players.find(p=>p.id===Number(x.dataset.editPlayer));render()});
  $$('[data-edit-user]').forEach(x=>x.onclick=()=>{state.editingUser=state.users.find(u=>u.id===Number(x.dataset.editUser));render()});
  $$('[data-edit-notification]').forEach(x=>x.onclick=()=>{state.editingNotification=state.notifications.find(n=>n.id===Number(x.dataset.editNotification));render()});
  $('#cancelTeam')?.addEventListener('click',()=>{state.editingTeam=null;render()});$('#cancelPlayer')?.addEventListener('click',()=>{state.editingPlayer=null;render()});$('#cancelUser')?.addEventListener('click',()=>{state.editingUser=null;render()});$('#cancelNotification')?.addEventListener('click',()=>{state.editingNotification=null;render()});
  $$('[data-delete-team]').forEach(x=>x.onclick=async()=>{if(confirm('Excluir este time e seus vínculos?'))try{await genericDelete('teams',Number(x.dataset.deleteTeam));await refresh('Time excluído.')}catch(e){notify(e.message,true)}});
  $$('[data-delete-player]').forEach(x=>x.onclick=async()=>{if(confirm('Excluir este jogador e seus vínculos?'))try{await api(`/admin/players/${x.dataset.deletePlayer}`,{method:'DELETE'});await refresh('Jogador excluído.')}catch(e){notify(e.message,true)}});
  $$('[data-delete-link]').forEach(x=>x.onclick=async()=>{try{await genericDelete('player-team-years',Number(x.dataset.deleteLink));await refresh('Vínculo removido.')}catch(e){notify(e.message,true)}});
  $$('[data-delete-user]').forEach(x=>x.onclick=async()=>{const name=x.dataset.userName;if(confirm(`Excluir permanentemente ${name}? Sessões, login Google, partidas ranqueadas e pontuação também serão apagados.`))try{await api(`/admin/users/${x.dataset.deleteUser}`,{method:'DELETE'});state.editingUser=null;await refresh('Usuário e todos os registros vinculados foram excluídos.')}catch(e){notify(e.message,true)}});
  $$('[data-toggle-notification]').forEach(x=>x.onclick=async()=>{const published=x.dataset.notificationStatus==='published';try{await api(`/admin/notifications/${x.dataset.toggleNotification}`,{method:'PATCH',body:JSON.stringify({status:published?'draft':'published'})});await refresh(published?'Notificação retirada do site.':'Notificação publicada.')}catch(e){notify(e.message,true)}});
  $$('[data-delete-notification]').forEach(x=>x.onclick=async()=>{if(confirm(`Excluir a notificação “${x.dataset.notificationTitle}”?`))try{await api(`/admin/notifications/${x.dataset.deleteNotification}`,{method:'DELETE'});state.editingNotification=null;await refresh('Notificação excluída.')}catch(e){notify(e.message,true)}});
  $$('[data-save-ranking]').forEach(x=>x.onclick=async()=>{const row=x.closest('[data-ranking-user]');try{const data={points:Number($('[data-ranking-points]',row).value),matches:Number($('[data-ranking-matches]',row).value),unlimited:$('[data-ranking-unlimited]',row).checked};await api(`/admin/ranking/users/${x.dataset.saveRanking}`,{method:'PATCH',body:JSON.stringify(data)});await refresh('Configuração do ranking atualizada.')}catch(e){notify(e.message,true)}});
  $$('[data-release-ranking]').forEach(x=>x.onclick=async()=>{if(!confirm('Liberar mais uma tentativa ranqueada para este usuário hoje?'))return;try{await api(`/admin/ranking/users/${x.dataset.releaseRanking}/release`,{method:'POST'});await refresh('Uma tentativa extra foi liberada para hoje.')}catch(e){notify(e.message,true)}});
}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));const result=await api('/auth/login',{method:'POST',body:JSON.stringify(data)});if(result.user.role!=='admin')throw new Error('Este usuário não é administrador.');auth.token=result.token;auth.user=result.user;localStorage.setItem(AUTH_TOKEN_KEY,auth.token);await load();showAdmin();render()}catch(x){showLogin(x.message)}};
$('#logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}auth.token=null;auth.user=null;localStorage.removeItem(AUTH_TOKEN_KEY);showLogin()};
(async()=>{if(!auth.token)return showLogin();try{auth.user=await api('/auth/me');if(auth.user.role!=='admin')throw new Error();await load();showAdmin();render()}catch{showLogin('Faça login novamente.')}})();
</script>
</body>
</html>
